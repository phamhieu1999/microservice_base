services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  postgres-auth:
    image: postgres:15
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Changed to 6380 to avoid conflict with host Redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      AUTH_DB_HOST: postgres-auth
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: auth_password
      AUTH_DB_NAME: auth_db
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: access-secret
      JWT_REFRESH_SECRET: refresh-secret
      DB_POOL_CONNECTION_TIMEOUT: 30000
    ports:
      - "3001:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    environment:
      PORT: 3002
      PRODUCT_MONGO_URI: mongodb://mongo:27017/product_db
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  cart-service:
    build:
      context: ../services/cart-service
      dockerfile: Dockerfile
    environment:
      PORT: 3006
      CART_MONGO_URI: mongodb://mongo:27017/cart_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3006:3006"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy

  review-service:
    build:
      context: ../services/review-service
      dockerfile: Dockerfile
    environment:
      PORT: 3007
      REVIEW_MONGO_URI: mongodb://mongo:27017/review_db
    ports:
      - "3007:3007"
    depends_on:
      - mongo

  postgres-seller:
    image: postgres:15
    environment:
      POSTGRES_USER: seller_user
      POSTGRES_PASSWORD: seller_password
      POSTGRES_DB: seller_db
    ports:
      - "5436:5432"
    volumes:
      - postgres-seller-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seller_user -d seller_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  seller-service:
    build:
      context: ../services/seller-service
      dockerfile: Dockerfile
    environment:
      PORT: 3008
      SELLER_DB_HOST: postgres-seller
      SELLER_DB_PORT: 5432
      SELLER_DB_USER: seller_user
      SELLER_DB_PASSWORD: seller_password
      SELLER_DB_NAME: seller_db
    ports:
      - "3008:3008"
    depends_on:
      postgres-seller:
        condition: service_healthy

  postgres-promo:
    image: postgres:15
    environment:
      POSTGRES_USER: promo_user
      POSTGRES_PASSWORD: promo_password
      POSTGRES_DB: promo_db
    ports:
      - "5437:5432"
    volumes:
      - postgres-promo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo_user -d promo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  promotion-service:
    build:
      context: ../services/promotion-service
      dockerfile: Dockerfile
    environment:
      PORT: 3009
      PROMO_DB_HOST: postgres-promo
      PROMO_DB_PORT: 5432
      PROMO_DB_USER: promo_user
      PROMO_DB_PASSWORD: promo_password
      PROMO_DB_NAME: promo_db
    ports:
      - "3009:3009"
    depends_on:
      postgres-promo:
        condition: service_healthy

  postgres-shipping:
    image: postgres:15
    environment:
      POSTGRES_USER: shipping_user
      POSTGRES_PASSWORD: shipping_password
      POSTGRES_DB: shipping_db
    ports:
      - "5441:5432"
    volumes:
      - postgres-shipping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping_user -d shipping_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  shipping-service:
    build:
      context: ../services/shipping-service
      dockerfile: Dockerfile
    environment:
      PORT: 3010
      SHIPPING_DB_HOST: postgres-shipping
      SHIPPING_DB_PORT: 5432
      SHIPPING_DB_USER: shipping_user
      SHIPPING_DB_PASSWORD: shipping_password
      SHIPPING_DB_NAME: shipping_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3010:3010"
    depends_on:
      postgres-shipping:
        condition: service_healthy
      kafka:
        condition: service_started

  chat-service:
    build:
      context: ../services/chat-service
      dockerfile: Dockerfile
    environment:
      PORT: 3011
      CHAT_MONGO_URI: mongodb://mongo:27017/chat_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3011:3011"
    depends_on:
      - mongo
      - kafka

  search-service:
    build:
      context: ../services/search-service
      dockerfile: Dockerfile
    environment:
      PORT: 3012
      SEARCH_MONGO_URI: mongodb://mongo:27017/search_db
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      USE_ELASTICSEARCH: "true"
    ports:
      - "3012:3012"
    depends_on:
      - mongo
      - kafka
      - redis
      - elasticsearch

  postgres-order:
    image: postgres:15
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
      POSTGRES_DB: order_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:15
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: payment_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    environment:
      PORT: 3003
      ORDER_DB_HOST: postgres-order
      ORDER_DB_PORT: 5432
      ORDER_DB_USER: order_user
      ORDER_DB_PASSWORD: order_password
      ORDER_DB_NAME: order_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3003:3003"
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    environment:
      PORT: 3004
      PAYMENT_DB_HOST: postgres-payment
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USER: payment_user
      PAYMENT_DB_PASSWORD: payment_password
      PAYMENT_DB_NAME: payment_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3004:3004"
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    environment:
      PORT: 3005
      KAFKA_BROKERS: kafka:9092
      NOTIFICATION_MONGO_URI: mongodb://mongo:27017/notification_db
      JWT_ACCESS_SECRET: access-secret
    ports:
      - "3005:3005"
    depends_on:
      - kafka
      - mongo

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      CART_SERVICE_URL: http://cart-service:3006
      REVIEW_SERVICE_URL: http://review-service:3007
      SELLER_SERVICE_URL: http://seller-service:3008
      SETTLEMENT_SERVICE_URL: http://settlement-service:3017
      PROMOTION_SERVICE_URL: http://promotion-service:3009
      SHIPPING_SERVICE_URL: http://shipping-service:3010
      CHAT_SERVICE_URL: http://chat-service:3011
      SEARCH_SERVICE_URL: http://search-service:3012
      LOYALTY_SERVICE_URL: http://loyalty-service:3015
      DISPUTE_SERVICE_URL: http://dispute-service:3016
      DLQ_SERVICE_URL: http://dlq-service:3013
      WAREHOUSE_SERVICE_URL: http://warehouse-service:3018
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      JWT_ACCESS_SECRET: access-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      dispute-service:
        condition: service_started
      dlq-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      # Port 3000 exposed for direct access (development)
      # In production, consider removing this and access only via Nginx (port 80)
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   ports:
  #     - "16686:16686"  # Jaeger UI
  #     - "14268:14268"  # HTTP collector
  #   environment:
  #     - COLLECTOR_ZIPKIN_HTTP_PORT=9411

  dlq-service:
    build:
      context: ../services/dlq-service
      dockerfile: Dockerfile
    environment:
      PORT: 3013
      DLQ_MONGO_URI: mongodb://mongo:27017/dlq_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3013:3013"
    depends_on:
      - mongo
      - kafka

  analytics-service:
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    environment:
      PORT: 3014
      ANALYTICS_MONGO_URI: mongodb://mongo:27017/analytics_db
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3014:3014"
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "${CLICKHOUSE_PORT_HTTP:-8123}:8123" # HTTP interface
      - "${CLICKHOUSE_PORT_NATIVE:-9000}:9000" # Native protocol
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-warehouse_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-warehouse_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-warehouse_password}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres-loyalty:
    image: postgres:15
    environment:
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_password
      POSTGRES_DB: loyalty_db
    ports:
      - "5438:5432"
    volumes:
      - postgres-loyalty-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty_user -d loyalty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  loyalty-service:
    build:
      context: ../services/loyalty-service
      dockerfile: Dockerfile
    environment:
      PORT: 3015
      LOYALTY_DB_HOST: postgres-loyalty
      LOYALTY_DB_PORT: 5432
      LOYALTY_DB_USER: loyalty_user
      LOYALTY_DB_PASSWORD: loyalty_password
      LOYALTY_DB_NAME: loyalty_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3015:3015"
    depends_on:
      postgres-loyalty:
        condition: service_healthy
      kafka:
        condition: service_started

  postgres-dispute:
    image: postgres:15
    environment:
      POSTGRES_USER: dispute_user
      POSTGRES_PASSWORD: dispute_password
      POSTGRES_DB: dispute_db
    ports:
      - "5439:5432"
    volumes:
      - postgres-dispute-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute_user -d dispute_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  dispute-service:
    build:
      context: ../services/dispute-service
      dockerfile: Dockerfile
    environment:
      PORT: 3016
      DISPUTE_DB_HOST: postgres-dispute
      DISPUTE_DB_PORT: 5432
      DISPUTE_DB_USER: dispute_user
      DISPUTE_DB_PASSWORD: dispute_password
      DISPUTE_DB_NAME: dispute_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3016:3016"
    depends_on:
      postgres-dispute:
        condition: service_healthy
      kafka:
        condition: service_started

  postgres-settlement:
    image: postgres:15
    environment:
      POSTGRES_USER: settlement_user
      POSTGRES_PASSWORD: settlement_password
      POSTGRES_DB: settlement_db
    ports:
      - "5440:5432"
    volumes:
      - postgres-settlement-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement_user -d settlement_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  settlement-service:
    build:
      context: ../services/settlement-service
      dockerfile: Dockerfile
    environment:
      PORT: 3017
      SETTLEMENT_DB_HOST: postgres-settlement
      SETTLEMENT_DB_PORT: 5432
      SETTLEMENT_DB_USER: settlement_user
      SETTLEMENT_DB_PASSWORD: settlement_password
      SETTLEMENT_DB_NAME: settlement_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3017:3017"
    depends_on:
      postgres-settlement:
        condition: service_healthy
      kafka:
        condition: service_started

  warehouse-service:
    build:
      context: ../services/warehouse-service
      dockerfile: Dockerfile
    environment:
      PORT: ${WAREHOUSE_SERVICE_PORT:-3018}
      CLICKHOUSE_HOST: ${WAREHOUSE_CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${WAREHOUSE_CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-warehouse_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-warehouse_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-warehouse_db}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3018:3018"
    depends_on:
      - clickhouse
      - kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_started
      zookeeper:
        condition: service_started

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  postgres-auth-data:
  postgres-order-data:
  postgres-payment-data:
  postgres-seller-data:
  postgres-promo-data:
  postgres-shipping-data:
  postgres-loyalty-data:
  postgres-dispute-data:
  postgres-settlement-data:
  mongo-data:
  elasticsearch-data:
  clickhouse-data:
  clickhouse-logs:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  nginx-logs:
