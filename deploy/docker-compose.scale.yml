# Docker Compose configuration for horizontal scaling
# This file demonstrates how to scale services horizontally
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Or manually scale:
#   docker-compose up --scale api-gateway=3 --scale product-service=2

version: '3.9'

# Note: This is a reference file showing scaling configuration
# In production, use docker-compose up --scale <service>=<replicas>

services:
  # Example: Scale API Gateway to 3 instances
  # api-gateway:
  #   deploy:
  #     replicas: 3

  # Example: Scale Product Service to 2 instances
  # product-service:
  #   deploy:
  #     replicas: 2

  # Example: Scale Order Service to 2 instances
  # order-service:
  #   deploy:
  #     replicas: 2

  # Example: Scale Payment Service to 2 instances
  # payment-service:
  #   deploy:
  #     replicas: 2

