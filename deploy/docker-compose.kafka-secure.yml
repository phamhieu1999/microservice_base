# Kafka với SASL Authentication - Production Ready
# Sử dụng file này cho production environment
# Copy và rename thành docker-compose.yml hoặc merge vào file chính

version: '3.9'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093" # SASL_PLAINTEXT port
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      
      # SASL Configuration
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_PLAINTEXT://kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      
      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
      # Performance tuning
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      
      # JAAS Configuration (sẽ được tạo bởi init script)
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka-config:/etc/kafka
    command: >
      sh -c "
      # Tạo JAAS config file
      echo 'KafkaServer {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username=\"kafka-admin\"
        password=\"kafka-admin-password\";
      };
      Client {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username=\"kafka-admin\"
        password=\"kafka-admin-password\";
      };' > /etc/kafka/kafka_server_jaas.conf &&
      
      # Tạo users (cần có kafka-configs tool)
      # /usr/bin/kafka-configs --zookeeper zookeeper:2181 --alter --add-config 'SCRAM-SHA-512=[password=kafka-admin-password]' --entity-type users --entity-name kafka-admin &&
      # /usr/bin/kafka-configs --zookeeper zookeeper:2181 --alter --add-config 'SCRAM-SHA-512=[password=warehouse-service-password]' --entity-type users --entity-name warehouse-service &&
      
      # Start Kafka
      /etc/confluent/docker/run
      "

volumes:
  kafka-data:

