# HAProxy Configuration for API Gateway Load Balancing
# This is a sample configuration for reference
# To use HAProxy, uncomment the haproxy service in docker-compose.yml

global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    retries 3

# Statistics Dashboard
# Access at: http://localhost:8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats show-legends

# Main Frontend - Entry Point
frontend api_frontend
    bind *:80
    
    # ACL for health checks
    acl is_health path_beg /health
    use_backend health_backend if is_health
    
    # Default backend
    default_backend api_gateway_backend

# Health Check Backend
backend health_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api-gateway-1 api-gateway:3000 check inter 5s fall 3 rise 2

# API Gateway Backend
backend api_gateway_backend
    # Load balancing algorithm
    balance leastconn
    
    # Health check configuration
    option httpchk GET /health
    http-check expect status 200
    http-check expect string "healthy"
    
    # Session persistence (cookie-based)
    cookie SERVERID insert indirect nocache
    
    # Server definitions
    # When scaling, add more servers:
    # server api-gateway-2 api-gateway-2:3000 check cookie s2
    # server api-gateway-3 api-gateway-3:3000 check cookie s3
    server api-gateway-1 api-gateway:3000 check inter 5s fall 3 rise 2 cookie s1
    
    # Health check intervals:
    # - inter: interval between checks (5s)
    # - fall: number of failed checks before marking as down (3)
    # - rise: number of successful checks before marking as up (2)

# Optional: SSL/TLS Termination
# frontend api_frontend_ssl
#     bind *:443 ssl crt /etc/haproxy/cert.pem
#     default_backend api_gateway_backend

# Optional: Rate Limiting
# frontend api_frontend
#     stick-table type ip size 100k expire 30s store http_req_rate(10s)
