# Docker Compose cho Development Mode với Hot Reload
# Usage: docker compose -f docker-compose.dev.yml up -d <service-name>

version: '3.8'

services:
  # Infrastructure services (giống như production)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  postgres-auth:
    image: postgres:15
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  # Development services với hot reload
  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3005
      NODE_ENV: development
      NOTIFICATION_MONGO_URI: mongodb://mongo:27017/notification_db
      KAFKA_BROKERS: kafka:9092
      JWT_ACCESS_SECRET: access-secret
      JWT_REFRESH_SECRET: refresh-secret
    volumes:
      # Mount source code để hot reload
      - ../services/notification-service/src:/usr/src/app/src:ro
      - ../services/notification-service/package.json:/usr/src/app/package.json:ro
      - ../services/notification-service/tsconfig.json:/usr/src/app/tsconfig.json:ro
      # Mount node_modules để không bị ghi đè
      - notification-service-node-modules:/usr/src/app/node_modules
    ports:
      - "3005:3005"
    depends_on:
      - mongo
      - kafka
    command: npm run start:dev

  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3002
      NODE_ENV: development
      PRODUCT_MONGO_URI: mongodb://mongo:27017/product_db
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ../services/product-service/src:/usr/src/app/src:ro
      - ../services/product-service/package.json:/usr/src/app/package.json:ro
      - ../services/product-service/tsconfig.json:/usr/src/app/tsconfig.json:ro
      - product-service-node-modules:/usr/src/app/node_modules
    ports:
      - "3002:3002"
    depends_on:
      - mongo
      - kafka
    command: npm run start:dev

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3001
      NODE_ENV: development
      AUTH_DB_HOST: postgres-auth
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: auth_password
      AUTH_DB_NAME: auth_db
      KAFKA_BROKERS: kafka:9092
      JWT_ACCESS_SECRET: access-secret
      JWT_REFRESH_SECRET: refresh-secret
    volumes:
      - ../services/auth-service/src:/usr/src/app/src:ro
      - ../services/auth-service/package.json:/usr/src/app/package.json:ro
      - ../services/auth-service/tsconfig.json:/usr/src/app/tsconfig.json:ro
      - auth-service-node-modules:/usr/src/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - postgres-auth
      - kafka
    command: npm run start:dev

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  mongo-data:
  redis-data:
  postgres-auth-data:
  notification-service-node-modules:
  product-service-node-modules:
  auth-service-node-modules:

