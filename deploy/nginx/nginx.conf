# Nginx Load Balancer Configuration for API Gateway
# This configuration enables horizontal scaling by distributing requests
# across multiple API Gateway instances

upstream api_gateway {
    # Use least connections algorithm for better load distribution
    least_conn;
    
    # API Gateway instances (can be scaled with docker-compose)
    server api-gateway:3000 max_fails=3 fail_timeout=30s;
    # Add more instances when scaling:
    # server api-gateway-2:3000 max_fails=3 fail_timeout=30s;
    # server api-gateway-3:3000 max_fails=3 fail_timeout=30s;
    
    # Health check
    keepalive 32;
}

# Health check endpoint
upstream api_gateway_health {
    server api-gateway:3000;
}

server {
    listen 80;
    server_name localhost;

    # Increase buffer sizes for large requests
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Health check endpoint
    location /health {
        proxy_pass http://api_gateway_health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Main API endpoints
    location / {
        proxy_pass http://api_gateway;
        
        # Headers for proper request forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Caching headers (optional)
        proxy_cache_bypass $http_upgrade;
        
        # Logging
        access_log /var/log/nginx/api_gateway_access.log;
        error_log /var/log/nginx/api_gateway_error.log;
    }

    # Static assets (if serving from gateway)
    location /static/ {
        proxy_pass http://api_gateway;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}

