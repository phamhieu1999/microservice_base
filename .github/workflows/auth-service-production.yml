# Production: Build Docker image, push Registry, deploy (auth-service)
# Chạy khi push/tag lên main hoặc khi release

name: Auth Service – Production

on:
  push:
    branches: [main, master]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-production.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  SERVICE_NAME: auth-service
  REGISTRY: ghcr.io  # GitHub Container Registry; hoặc docker.io, registry.gitlab.com, etc.

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Lint & Test
        working-directory: services/auth-service
        run: |
          npm ci 2>/dev/null || npm install
          npm run lint
          npm run test -- --passWithNoTests
          npm run build

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment: optional approvals, secrets
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # Ví dụ: SSH deploy hoặc kubectl
          # DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          # DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          # SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Image built: $IMAGE"
          echo "Production deploy: cập nhật server/kubernetes để pull và chạy image trên."
          # Ví dụ SSH:
          # echo "$SSH_PRIVATE_KEY" > key.pem && chmod 600 key.pem
          # ssh -i key.pem $DEPLOY_USER@$DEPLOY_HOST "cd /app && docker compose pull auth-service && docker compose up -d auth-service"
          # Ví dụ kubectl:
          # kubectl set image deployment/auth-service auth-service=$IMAGE -n production
          # kubectl rollout status deployment/auth-service -n production
